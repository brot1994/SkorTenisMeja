<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skor Tenis Meja</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--line:#dfe3e8;--tx:#151a21;--mut:#5f6b7a;--acc:#1f6fd1;--ok:#178a52;--bad:#c93434;--warn:#a96500;
  --okbg:#e3f5ea;--badbg:#fbe7e7;--warnbg:#fff2dc;--accbg:#e5effc;--sel:#ffe9a8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1318;--card:#171c23;--line:#2a323d;--tx:#eef1f5;--mut:#9aa6b5;--acc:#5aa6ff;--ok:#4fd08f;--bad:#ff6b6b;--warn:#ffb547;--okbg:#14301f;--badbg:#3a1717;--warnbg:#3a2a10;--accbg:#13263d;--sel:#4a3c0c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171c23;--line:#2a323d;--tx:#eef1f5;--mut:#9aa6b5;--acc:#5aa6ff;--ok:#4fd08f;--bad:#ff6b6b;--warn:#ffb547;--okbg:#14301f;--badbg:#3a1717;--warnbg:#3a2a10;--accbg:#13263d;--sel:#4a3c0c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:42px}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dan{color:var(--bad);border-color:var(--bad)}
button.sm{min-height:32px;padding:4px 10px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:38px;max-width:100%}
input[type=checkbox]{min-height:0;width:18px;height:18px;vertical-align:middle}
textarea{width:100%;min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
label.ck{display:inline-flex;align-items:center;font-size:15px;color:var(--tx);margin:0}
label.ck input{margin-right:6px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;align-items:center}
.row>*{margin:0 8px 8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-gap:12px;gap:12px}
.mut{color:var(--mut)}
.small{font-size:13px}
h1{font-size:22px;margin:0 0 12px;font-weight:600}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--tx);vertical-align:middle;white-space:nowrap}
.pill.live{background:var(--badbg);color:var(--bad)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.acc{background:var(--accbg);color:var(--acc)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar a{color:var(--acc);text-decoration:none}
.conn{font-size:13px}
.conn.off{color:var(--bad)}
.tscroll{overflow-x:auto}
table.lst{width:100%;border-collapse:collapse;font-size:14px}
table.lst td,table.lst th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.lst th{font-weight:600;color:var(--mut);font-size:13px}
table.lst input{min-height:34px;padding:4px 7px}
.home a.big{display:block;padding:22px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:20px;font-weight:600}
.home a.big span{display:block;font-size:14px;font-weight:400;color:var(--mut)}
.url{font-family:Consolas,monospace;font-size:17px;word-break:break-all}
.tabsb{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabsb a{padding:10px 14px;text-decoration:none;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600}
.tabsb a.on{color:var(--acc);border-bottom-color:var(--acc)}
.steps{display:flex;flex-wrap:wrap;margin-bottom:14px}
.steps span{font-size:13px;padding:6px 12px;border-radius:999px;margin:0 6px 6px 0;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.steps span.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.steps span.dn{color:var(--ok);border-color:var(--ok)}
.opt td{cursor:pointer}
.opt tr.on td{background:var(--accbg)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-gap:10px;gap:10px}
.gcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}
.gcard h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between}
.ent{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:14px;border:1px solid transparent}
.ent:hover{border-color:var(--line)}
.ent.sel{background:var(--sel)}
.ent .s{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;margin-left:8px;white-space:nowrap}
.warnbox{padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin:10px 0}
.okbox{padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);margin:10px 0}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;font-family:Consolas,monospace;background:var(--card)}

/* wasit */
.sc{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px}
.side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.side .nm{font-size:20px;font-weight:600;min-height:30px}
.side .pts{font-size:96px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0}
.side .sw{font-size:15px;color:var(--mut)}
.plus{width:100%;min-height:120px;font-size:44px;font-weight:600;background:var(--accbg);border-color:var(--acc);color:var(--acc);border-radius:16px;margin-top:8px}
.minus{width:100%;margin-top:8px}
.tabs{display:flex;flex-wrap:wrap}
.tabs .t{flex:1;min-width:110px;margin:0 6px 6px 0;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:center;font-size:14px}
.tabs .t.on{border:2px solid var(--acc)}
.tabs .t.w{background:var(--okbg)}
.msg{padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin:10px 0;font-weight:600;text-align:center}
.cand{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;background:var(--card)}

/* TV */
.tvroot{position:fixed;left:0;top:0;right:0;bottom:0;background:#090c10;overflow:hidden;cursor:none}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#eef1f5;padding:26px 34px 26px;display:flex;flex-direction:column;font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:#0b0e13;line-height:1.3}
.tvh{display:flex;align-items:center;justify-content:space-between;height:96px;flex:none}
.tvh .t1{font-size:40px;font-weight:700;line-height:1.1}
.tvh .t2{font-size:22px;color:#93a0b2;margin-top:4px}
.tvh .clk{font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
.tvmain{flex:1;display:flex;min-height:0;margin-top:16px}
.tvbot{height:300px;flex:none;display:flex;margin-top:18px}
.pnl{background:#141922;border:1px solid #232b37;border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pnl+.pnl{margin-left:18px}
.pt{flex:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pt .n{font-size:30px;font-weight:700}
.pt .p{font-size:20px;color:#93a0b2}
.bar{flex:none;height:8px;background:#262f3c;border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:#3ecf8e}
table.mx{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed}
table.mx th{font-size:20px;font-weight:700;border-radius:8px;padding:8px 2px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.mx td{line-height:1.1;background:#1b2230;border-radius:8px;text-align:center;font-variant-numeric:tabular-nums;vertical-align:middle;padding:4px 2px}
table.mx td.tm{font-size:21px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.mx td.scx{font-size:34px;font-weight:700}
table.mx td.scx.w{color:#3ecf8e}
table.mx td.scx.l{color:#7d889a}
table.mx td.scx.lv{box-shadow:inset 0 0 0 3px #ff5a5a;color:#ff7b7b}
table.mx td.st{font-size:26px;font-weight:600;background:#161c27}
table.mx td.rk{font-size:30px;font-weight:800}
table.mx th.h{background:transparent;color:#93a0b2;font-size:17px;font-weight:600}
.dots{display:block;margin-top:6px;line-height:0;font-size:0}
.dots b{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 3px;background:#2c3646}
.dots b.w{background:#3ecf8e}.dots b.l{background:#5a6475}.dots b.lv{background:#ff5a5a}
.rk1{color:#ffd166}
.ggrid{display:grid;grid-gap:16px;flex:1;min-height:0}
.gtv{background:#141922;border:1px solid #232b37;border-radius:16px;padding:14px 20px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.gtv .gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.gtv .gh b{font-size:28px}
.gtv .gh span{font-size:18px;color:#93a0b2}
table.gt{width:100%;border-collapse:collapse;table-layout:fixed}
table.gt th{font-size:16px;color:#7d889a;font-weight:600;text-align:center;padding:2px 4px}
table.gt td{font-size:24px;padding:3px 4px;text-align:center;border-top:1px solid #232b37;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.gt td.n{text-align:left;font-weight:600}
table.gt tr.q td{color:#3ecf8e}
table.gt tr.q td.n{color:#d6ffe9}
.ldot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ff5a5a;margin-left:8px;vertical-align:middle}
.tcard{flex:1;background:#141922;border:1px solid #232b37;border-radius:16px;padding:16px 22px;display:flex;flex-direction:column;min-width:0;margin-right:18px}
.tcard.live{border:3px solid #ff5a5a;padding:14px 20px}
.tch{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#93a0b2;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.tch b{color:#fff;font-size:26px;margin-right:12px}
.tpill{font-size:18px;font-weight:700;padding:3px 12px;border-radius:999px;background:#2a3341;color:#c9d2de;margin-left:10px}
.tpill.live{background:#ff5a5a;color:#fff}
.tpill.done{background:#1f6b45;color:#d6ffe9}
.tr{display:flex;align-items:center;height:74px}
.tr .who{flex:1;min-width:0}
.tr .who .nm{font-size:32px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .who .pl{font-size:18px;color:#93a0b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .bx{width:74px;text-align:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:#c9d2de}
.tr .big{width:120px;text-align:right;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.tlab{display:flex;justify-content:flex-end;font-size:15px;color:#7d889a}
.tlab span{text-align:center}
.tinfo{font-size:19px;color:#93a0b2;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcard{width:560px;flex:none;background:#141922;border:1px solid #232b37;border-radius:16px;padding:16px 22px;display:flex;flex-direction:column;overflow:hidden}
.qcard h4{margin:0 0 8px;font-size:24px;color:#fff}
.qi{display:flex;align-items:center;justify-content:space-between;font-size:21px;padding:7px 0;border-bottom:1px solid #232b37}
.qi:last-child{border-bottom:0}
.qi .r{font-size:18px;font-weight:600;white-space:nowrap;margin-left:10px}
.qi .r.ok{color:#3ecf8e}.qi .r.wt{color:#ffb547}
.tchip{display:inline-block;padding:1px 10px;border-radius:7px;font-weight:700}
.cb{display:inline-block;font-size:15px;padding:2px 8px;border-radius:6px;background:#263142;color:#b9c6d8;margin-right:8px;vertical-align:middle}
.pgdots{margin-left:18px}
.pgdots b{display:inline-block;width:12px;height:12px;border-radius:50%;background:#3a4556;margin-left:6px}
.pgdots b.on{background:#fff}
.br{display:flex;flex:1;min-height:0}
.bcol{flex:1;display:flex;flex-direction:column;min-width:0;margin-right:16px}
.bcol:last-child{margin-right:0}
.bcol .bh{font-size:20px;color:#93a0b2;font-weight:600;text-align:center;margin-bottom:6px;height:28px;white-space:nowrap}
.bcol .bb{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.bm{background:#1b2230;border:1px solid #2a3341;border-radius:10px;overflow:hidden}
.bm.lv{border:2px solid #ff5a5a}
.bm .s{display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:30px;font-size:19px}
.bm .s+.s{border-top:1px solid #2a3341}
.bm .s .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bm .s.w{font-weight:700;color:#3ecf8e}
.bm .s.x{color:#5f6b7c}
.bm .s .v{font-weight:700;margin-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bm .cap{font-size:14px;color:#ff7b7b;padding:2px 10px;background:#161c27}
.champ{border:2px solid #ffd166;border-radius:12px;padding:14px;text-align:center;background:#1f1a0c}
.champ .k{font-size:18px;color:#ffd166}
.champ .v{font-size:26px;font-weight:800;margin-top:4px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;color:#7d889a;text-align:center}
.demo2{display:grid;grid-template-columns:3fr 2fr;grid-gap:12px;gap:12px;padding:12px}
.tvbox{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#090c10}
.tvbox .stage{position:absolute}
@media (max-width:820px){.demo2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
"use strict";
/* ============================================================
   UTIL
   ============================================================ */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function clone(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function hm(t){ var d = new Date(t); return pad2(d.getHours()) + "." + pad2(d.getMinutes()); }
function textOn(hex){
  var c = String(hex || "#888888").replace("#", ""); if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#111" : "#fff";
}
var clockOffset = 0;
function now(){ return Date.now() + clockOffset; }
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function uid(p){ return (p || "x") + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36); }
function toMin(hhmm){ var m = String(hhmm || "").match(/(\d{1,2})[.:](\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; }
function minTxt(n){ n = Math.round(n); var h = Math.floor(n/60), m = n % 60; return (h ? h + " j " : "") + (m || !h ? m + " m" : ""); }
function clockTxt(n){ n = Math.round(n); return pad2(Math.floor(n/60) % 24) + "." + pad2(n % 60); }

/* ============================================================
   MODEL: divisi & kekuatan
   ============================================================ */
var AM = 12; /* amatir = 12 */
var PALETTE = ["#d9d9d9","#ffff00","#ff3b3b","#b4c7e7","#c5e0b4","#f4b183","#c9a0dc","#9fe1e6","#ffd966","#a9d08e","#f8cbad","#8ea9db"];
function parseDiv(v){
  v = String(v == null ? "" : v).trim(); if (!v) return null;
  if (/^a/i.test(v)) return AM;
  var n = parseInt(v, 10); if (isNaN(n)) return null;
  return Math.max(1, Math.min(AM, n));
}
function divTxt(d){ return d == null ? "" : (d >= AM ? "A" : String(d)); }
function rosterTxt(r){ return (r || []).map(function(p){ return p.name + (p.div ? " " + divTxt(p.div) : ""); }).join(", "); }
function parseRoster(t){
  return String(t || "").split(/[,;\n]+/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
    var m = x.match(/^(.*?)[\s(]+(\d{1,2}|a|amatir)\)?$/i);
    return m ? { name: m[1].trim(), div: parseDiv(m[2]) } : { name: x, div: null };
  }).slice(0, 8);
}
function eStrength(cat, e){
  if (cat.type === "double") return (e.div || AM) + (e.div2 || AM);
  if (cat.type === "team"){
    var ds = (e.roster || []).map(function(p){ return p.div || AM; }).sort(function(a, b){ return a - b; });
    while (ds.length < 3) ds.push(AM);
    return ds[0] + ds[1] + ds[2];
  }
  return e.div || AM;
}
function normEntrant(cat, e){
  if (cat.type === "double"){ e.name = (e.p1 || "?") + " / " + (e.p2 || "?"); }
  return e;
}
function divLabel(st, cat, e){
  if (!st.settings.showDiv || !e) return "";
  if (cat.type === "single") return e.div ? " (" + divTxt(e.div) + ")" : "";
  if (cat.type === "double") return (e.div || e.div2) ? " (" + ((e.div || AM) + (e.div2 || AM)) + ")" : "";
  return "";
}
function typeName(t){ return t === "double" ? "Ganda" : t === "team" ? "Beregu" : "Tunggal"; }

/* ============================================================
   MODEL: aturan, pertandingan
   ============================================================ */
function defRules(){ return { group: { bo: 3, min: 15 }, ko: { bo: 3, min: 15 }, sf: { bo: 3, min: 15 }, third: { bo: 3, min: 15 }, final: { bo: 5, min: 25 } }; }
function defSettings(){ return { tables: 2, start: "08:00", end: "17:00", restMin: 10, points: 11, winPts: 1, losePts: 0, stopEarly: true, showDiv: false, rotateSec: 15 }; }
var STAGES = [["group","Babak grup / setengah kompetisi"],["ko","Babak gugur awal"],["sf","Semifinal"],["third","Perebutan juara 3"],["final","Final"]];
function newRub(label){ return { label: label, pa: "", pb: "", sets: [], cur: [0,0], win: null }; }
function isDouble(label){ return /ganda/i.test(label || ""); }
function stw(m){ return Math.ceil((+m.bo || 3) / 2); }
function koCount(cat, r){ var n = 0; cat.matches.forEach(function(m){ if (m.stage === "ko" && m.round === r && !m.third) n++; }); return n; }
function ruleKey(cat, m){
  if (m.stage === "group") return "group";
  if (m.third) return "third";
  var c = koCount(cat, m.round); return c === 1 ? "final" : c === 2 ? "sf" : "ko";
}

function genGroupMatches(cat, rules){
  var out = [];
  cat.groups.forEach(function(g){
    var t = g.ids.slice(); if (t.length < 2) return;
    if (t.length % 2) t.push(null);
    var n = t.length, arr = t.slice(), k = 0;
    for (var r = 0; r < n - 1; r++){
      for (var i = 0; i < n/2; i++){
        var a = arr[i], b = arr[n-1-i];
        if (a === null || b === null) continue;

function buildCat(c, rules){

    cat.thirdPlace = false;

    rules: rules, cats: [], tables: o.tables || [] };

        matches: c.matches.map(function(m){

    cur = cur[s];
  }
  var last = segs[segs.length - 1];
  if (data === null){ if (Array.isArray(cur)) cur[last] = null; else delete cur[last]; }
  else cur[last] = data;
}
function treeApply(holder, path, data, isPatch){
  var segs = String(path || "/").split("/").filter(Boolean);
  if (isPatch && data && typeof data === "object"){
    Object.keys(data).forEach(function(k){ treeSet(holder, segs.concat(k.split("/").filter(Boolean)), data[k]); });
  } else treeSet(holder, segs, data);
}
function listen(path, onEvt, onState){
  var es = new EventSource(clUrl(path));
  function h(isPatch){ return function(e){ try { var j = JSON.parse(e.data); onEvt(j.path, j.data, isPatch); } catch(_){} }; }
  es.addEventListener("put", h(false));
  es.addEventListener("patch", h(true));
  es.addEventListener("cancel", function(){ CL.permErr = true; if (onState) onState(false); renderSoon(); });
  es.onopen = function(){ if (onState) onState(true); };
  es.onerror = function(){ if (onState) onState(false); };
  return es;
}

/* ---------- normalisasi (Firebase membuang array kosong dan null) ---------- */
function arr(x, len){
  var out = [];
  if (Array.isArray(x)) out = x.slice();
  else if (x && typeof x === "object") Object.keys(x).forEach(function(k){ if (/^\d+$/.test(k)) out[+k] = x[k]; });
  if (len !== undefined) while (out.length < len) out.push(null);
  for (var i = 0; i < out.length; i++) if (out[i] === undefined) out[i] = null;
  return out;
}
function clNorm(t){
  if (!t || typeof t !== "object" || !t.event) return null;
  t.settings = Object.assign(defSettings(), t.settings || {});
  var r = defRules(); Object.keys(r).forEach(function(k){ r[k] = Object.assign(r[k], (t.rules || {})[k] || {}); }); t.rules = r;
  t.status = t.status || "active";
  t.cats = arr(t.cats).filter(Boolean).map(function(c){
    c.rubbers = arr(c.rubbers).filter(function(x){ return x != null; });
    if (!c.rubbers.length) c.rubbers = [c.type === "double" ? "Ganda" : "Tunggal"];
    c.entrants = arr(c.entrants).filter(Boolean).map(function(e){ if (c.type === "team") e.roster = arr(e.roster).filter(Boolean); return e; });
    c.groups = arr(c.groups).filter(Boolean).map(function(g){ g.ids = arr(g.ids).filter(function(x){ return x != null; }); return g; });
    c.slots = arr(c.slots);
    c.q = c.q || 0; c.tv = !!c.tv; c.thirdPlace = !!c.thirdPlace;
    c.matches = arr(c.matches).filter(Boolean).map(function(m){
      m.rub = arr(m.rub).filter(Boolean).map(function(r){
        r.sets = arr(r.sets).filter(Boolean).map(function(s){ var a = arr(s); return [+a[0] || 0, +a[1] || 0]; });
        var cu = arr(r.cur, 2); r.cur = [+cu[0] || 0, +cu[1] || 0];
        r.pa = r.pa || ""; r.pb = r.pb || ""; r.win = r.win || null;
        return r;
      });
      m.win = m.win || null; m.start = m.start || 0; m.end = m.end || 0; m.table = m.table || 0;
      return m;
    });
    return c;
  });
  t.tables = arr(t.tables, Math.max(1, +t.settings.tables || 1)).slice(0, Math.max(1, +t.settings.tables || 1));
  return t;
}
function clEnc(st){ var o = clone(st); delete o.version; delete o.serverTime; delete o.pinSet; delete o.id; return o; }
function jdiff(a, b, path, depth, out){
  var ja = JSON.stringify(a), jb = JSON.stringify(b);
  if (ja === jb) return;
  var ca = a !== null && typeof a === "object", cb = b !== null && typeof b === "object";
  if (depth >= 4 || !ca || !cb || Array.isArray(a) !== Array.isArray(b)){ out[path] = (b === undefined) ? null : b; return; }
  var keys = {}; Object.keys(a).forEach(function(k){ keys[k] = 1; }); Object.keys(b).forEach(function(k){ keys[k] = 1; });
  Object.keys(keys).forEach(function(k){ jdiff(a[k], b[k], path ? path + "/" + k : k, depth + 1, out); });
}
function summaryOfCloud(st){ return { title: st.event.title || "", place: st.event.place || "", dates: st.event.dates || "", status: st.status || "active", cats: st.cats.map(function(c){ return c.name; }), updated: st.created || Date.now() }; }

/* ---------- langganan data ---------- */
var clVer = 0;
function clRebuild(){
  var t = clNorm(clone(CL.R));
  if (t){ t.id = CL.tid; t.version = ++clVer; t.pinSet = !!CL.pinHash; S = t; ensureTables(S); }
  else S = { id: "", version: ++clVer };
  renderSoon();
}
function clOpenT(id){
  if (CL.esT){ CL.esT.close(); CL.esT = null; }
  CL.tid = id || ""; CL.R = null;
  if (!id){ S = { id: "", version: ++clVer }; renderSoon(); return; }
  CL.inflight = [];
  CL.esT = listen("t/" + id, function(path, data, isPatch){
    var base = String(path || "/").split("/").filter(Boolean).join("/"), touched = [];
    if (isPatch && data && typeof data === "object") Object.keys(data).forEach(function(k){ touched.push((base ? base + "/" : "") + k.split("/").filter(Boolean).join("/")); });
    else touched.push(base);
    var h = { v: CL.R }; treeApply(h, path, data, isPatch); CL.R = h.v;
    clAck(touched); clRebuild();
  }, function(ok){ online = ok; renderSoon(); });
}
function clStart(){
  clSyncClock();
  if (CL.esM) CL.esM.close();
  CL.M = null; CL.metaReady = false;
  CL.esM = listen("meta", function(path, data, isPatch){
    var h = { v: CL.M }; treeApply(h, path, data, isPatch); CL.M = h.v || {};
    CL.pinHash = CL.M.pinHash || null; CL.metaReady = true;
    var act = CL.M.active || "";
    if (act !== CL.tid) clOpenT(act); else if (S) { S.pinSet = !!CL.pinHash; renderSoon(); }
  }, function(ok){ online = ok; renderSoon(); });
}

function covers(a, b){ return a === "" || b === "" || a === b || b.indexOf(a + "/") === 0 || a.indexOf(b + "/") === 0; }
function clAck(touched){
  var t = Date.now();
  CL.inflight = CL.inflight.filter(function(x){
    x.left = x.left.filter(function(p){ return !touched.some(function(q){ return covers(p, q); }); });
    return x.left.length && t - x.t < 8000;
  });
}
function clPending(){ var t = Date.now(); CL.inflight = CL.inflight.filter(function(x){ return t - x.t < 8000; }); return CL.inflight.map(function(x){ return x.op; }); }

/* ---------- PIN ---------- */
async function sha256hex(s){
  if (window.crypto && crypto.subtle && window.TextEncoder){
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
  }
  var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "d" + (h >>> 0).toString(16);
}
async function clPinOk(){
  if (!CL.pinHash) return true;
  if (lsGet("tm_pinh_" + CL.k, "") === CL.pinHash) return true;
  for (var i = 0; i < 3; i++){
    var p = prompt(i ? "PIN salah. Masukkan PIN panitia:" : "Masukkan PIN panitia:");
    if (p === null) return false;
    var hsh = await sha256hex(CL.k + ":" + p);
    if (hsh === CL.pinHash){ lsSet("tm_pinh_" + CL.k, hsh); return true; }
  }
  return false;
}
function clPermAlert(){
  CL.permErr = true;
  alert("Firebase menolak penyimpanan (Permission denied).\n\nBuka Firebase Console > Realtime Database > Rules, lalu tambahkan:\n\n\"turnamen\": { \".read\": true, \".write\": true }\n\ndi dalam bagian \"rules\", kemudian Publish.");
}

/* ---------- tulis perubahan ---------- */
async function clPumpOne(o){
  if (!(await clPinOk())){ Q.length = 0; alert("Perubahan dibatalkan (PIN)."); return "stop"; }
  var baseSt = clone(S); clPending().forEach(function(x){ applyOp(baseSt, x); });
  var before = clEnc(baseSt), nextSt = clone(baseSt); applyOp(nextSt, o);
  var after = clEnc(nextSt), diff = {};
  jdiff(before, after, "", 0, diff);
  var keys = Object.keys(diff);
  if (!keys.length) return "ok";
  var upd = {};
  keys.forEach(function(p){ upd["t/" + CL.tid + "/" + p] = diff[p]; });
  if (JSON.stringify([before.event, before.status, before.cats.map(function(c){ return c.name; })]) !== JSON.stringify([after.event, after.status, after.cats.map(function(c){ return c.name; })]))
    upd["list/" + CL.tid] = summaryOfCloud(nextSt);
  var r = await fetch(clUrl(""), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(upd), cache: "no-store" });
  if (!r.ok) throw clErr(r);
  CL.inflight.push({ op: o, left: keys.slice(), t: Date.now() });
  return "ok";
}

    return Object.keys(j).map(function(id){ var s = j[id] || {}; return { id: id, title: s.title, place: s.place, dates: s.dates, status: s.status, cats: arr(s.cats), updated: s.updated || 0, active: id === act }; });
  },

  create: async function(st){

    var d = new Date(now()), id = slug(st.event.title) + "-" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());

function tvPages(st){

  st.cats.forEach(function(c){
    if (!c.tv || !c.matches.length) return;
    if (c.kind === "rr"){
      var n = c.groups[0].ids.length;
      if (n <= 6) rrSmall.push(c);
      else if (n <= 8) pages.push({ type: "rr", cats: [c] });
      else pages.push({ type: "groups", cat: c, groups: c.groups });
      return;
    }
    if (c.kind === "gko") for (var i = 0; i < c.groups.length; i += 4) pages.push({ type: "groups", cat: c, groups: c.groups.slice(i, i + 4) });

ACT.wPaste = function(d){
  var c = W.cats[+d.c], lines = $("#pt_" + d.c).value.split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean), n = 0;
  c.entrants = c.entrants.filter(function(e){ return c.type === "double" ? (e.p1 || e.p2) : e.name; });
  lines.forEach(function(L){
    var e = newEnt(c);
    if (c.type === "team"){
      var parts = L.split("|"); e.name = parts[0].trim(); e.roster = parseRoster(parts.slice(1).join(","));
    } else {
      var f = L.split(/\t|;|,/).map(function(x){ return x.trim(); });
      if (c.type === "double"){
        if (f.length === 1 && f[0].indexOf("/") > 0){ var pp = f[0].split("/"); f = [pp[0].trim(), "", (pp[1] || "").trim(), ""]; }
        e.p1 = f[0] || ""; e.div = parseDiv(f[1]); e.p2 = f[2] || ""; e.div2 = parseDiv(f[3]); e.seed = +f[4] || 0;
      } else { e.name = f[0]; e.div = parseDiv(f[1]); e.seed = +f[2] || 0; }
    }
    normEntrant(c, e); c.entrants.push(e); n++;
  });
  drawWizard(); toast(n + " peserta ditambahkan");
};
function wStep3(){
  return '<div class="card"><h2>Meja dan waktu</h2>' + settingsHTML(W.settings, "W:", true) + '</div>' +
    '<div class="card"><h2>Format per babak</h2>' + rulesHTML(W.rules, "W:") + '<p class="small mut">Menit per pertandingan dipakai untuk memperkirakan lama turnamen. Untuk beregu, dihitung per partai.</p></div>' + wNav(true, true);
}
function wStep4(){
  var h = '', tot = 0, avail = 0;
  W.cats.forEach(function(c, ci){
    var opts = formatOptions(c, W), cur = c.fmt, valid = fmtValid(c), est = estimate(c, cur, W);
    avail = est.avail; if (valid) tot += est.mins;
    h += '<div class="card"><h2>' + esc(c.name) + ' <span class="pill">' + c.entrants.length + ' ' + (c.type === "team" ? "tim" : c.type === "double" ? "pasangan" : "orang") + '</span></h2>' +
      '<div class="tscroll"><table class="lst opt"><tr><th></th><th>Format</th><th>Pertandingan</th><th>Estimasi</th><th>Main minimal</th><th>Catatan</th></tr>';
    opts.forEach(function(f, i){
      var on = f.kind === cur.kind && (f.kind !== "gko" || (+f.G === +cur.G && +f.q === +cur.q));
      var note = []; if (i === 0) note.push('<span class="pill ok">Disarankan</span>'); if (!f.est.ok) note.push('<span class="pill live">Melebihi waktu</span>'); if (f.est.byes) note.push(f.est.byes + " BYE");
      h += '<tr class="' + (on ? "on" : "") + '" data-a="wPick" data-c="' + ci + '" data-k="' + f.kind + '" data-g="' + (f.G || 0) + '" data-q="' + (f.q || 0) + '"><td><input type="radio" ' + (on ? "checked" : "") + ' tabindex="-1"></td><td>' + esc(f.label) + '</td><td>' + f.est.matches + '</td><td>±' + minTxt(f.est.mins) + '</td><td>' + f.est.minPlay + '×</td><td>' + note.join(" ") + '</td></tr>';
    });
    h += '</table></div>';
    h += '<div class="row" style="margin-top:10px"><span class="small mut">Atur sendiri:</span><select data-b="W:cats.' + ci + '.fmt.kind" data-on="wRefresh"><option value="rr" ' + (cur.kind === "rr" ? "selected" : "") + '>Setengah kompetisi</option><option value="ko" ' + (cur.kind === "ko" ? "selected" : "") + '>Gugur langsung</option><option value="gko" ' + (cur.kind === "gko" ? "selected" : "") + '>Grup lalu gugur</option></select>' +
      (cur.kind === "gko" ? '<label class="ck">Jumlah grup&nbsp;' + num("W:cats." + ci + ".fmt.G", cur.G, 'min="2" max="16" style="width:70px" data-on="wRefresh"') + '</label><label class="ck">Lolos per grup&nbsp;' + num("W:cats." + ci + ".fmt.q", cur.q, 'min="1" max="4" style="width:70px" data-on="wRefresh"') + '</label>' : '') +
      (cur.kind !== "rr" ? chk("W:cats." + ci + ".fmt.third", cur.third !== false, "Perebutan juara 3", 'data-on="wRefresh"') : '') + '</div>';
    h += !valid ? '<div class="warnbox">Kombinasi grup ini tidak bisa dipakai untuk ' + c.entrants.length + ' peserta (minimal 2 grup, setiap grup minimal 2 peserta, dan yang lolos harus lebih sedikit dari isi grup). Pilih salah satu saran di atas.</div>' :
      '<div class="' + (est.ok ? "okbox" : "warnbox") + '">Pilihan: <b>' + esc(fmtLabel(cur, c.entrants.length)) + '</b> · ' + est.matches + ' pertandingan · ±' + minTxt(est.mins) + ' dengan ' + W.settings.tables + ' meja' + (est.avail && !est.ok ? '. Melebihi waktu tersedia (' + minTxt(est.avail) + '); coba best of 3, tambah meja, atau format lain.' : '') + '</div>';
    h += '</div>';
  });
  if (W.cats.length > 1){
    var s0 = toMin(W.settings.start);
    h += '<div class="card"><b>Kalau semua kategori dimainkan di hari yang sama:</b> ±' + minTxt(tot) + (s0 != null ? ' (mulai ' + esc(W.settings.start) + ', selesai sekitar ' + clockTxt(s0 + tot) + ')' : '') +
      (avail && tot > avail ? '<div class="warnbox">Melebihi waktu yang tersedia. Bagi kategori ke beberapa hari (centang "Aktif hari ini" per kategori saat acara), atau pilih format yang lebih ringkas.</div>' : '') + '</div>';
  }
  return h + wNav(true, true, "Lanjut ke undian →");
}
ACT.wPick = function(d){
  var c = W.cats[+d.c]; c.fmt.kind = d.k; c.fmt.manual = true; if (d.k === "gko"){ c.fmt.G = +d.g; c.fmt.q = +d.q; }
  drawWizard();
};
function wStep5(){
  var h = '<div class="card"><p class="small mut" style="margin:0">Undian: peserta diurutkan dari unggulan dan divisi terkuat, peserta berdivisi sama diacak, lalu dibagi dengan pola ular supaya kekuatan tiap grup rata. Klik satu nama lalu klik nama lain untuk menukar posisinya.</p></div>';
  W.cats.forEach(function(c, ci){
    if (!c.draw || c.draw.sig !== drawSig(c)) c.draw = makeDraw(c);
    h += '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(c.name) + ' <span class="pill">' + esc(fmtLabel(c.fmt, c.entrants.length)) + '</span></h2><button data-a="wRedraw" data-c="' + ci + '">Acak ulang</button></div>';
    if (c.fmt.kind === "rr"){
      h += '<p class="mut small">Semua peserta saling bertemu. Jadwal putaran dibuat otomatis; bila jumlah ganjil, peserta yang bye bergiliran.</p><div class="gcards"><div class="gcard">' + c.draw.order.map(function(id){ return entRow(c, ci, id, "o"); }).join("") + '</div></div>';
    } else if (c.fmt.kind === "gko"){
      var avgs = [];
      h += '<div class="gcards" style="margin-top:10px">' + c.draw.groups.map(function(g, gi){
        var sum = 0; g.ids.forEach(function(id){ sum += eStrength(c, entById(c, id)); }); var avg = g.ids.length ? sum / g.ids.length : 0; avgs.push(avg);
        return '<div class="gcard"><h4><span>Grup ' + esc(g.id) + '</span><span class="small mut">rata-rata ' + avg.toFixed(1) + '</span></h4>' + g.ids.map(function(id){ return entRow(c, ci, id, "g" + gi); }).join("") + '</div>';
      }).join("") + '</div>';
      var spread = Math.max.apply(null, avgs) - Math.min.apply(null, avgs);
      h += '<p class="small mut">Selisih rata-rata kekuatan antar grup: <b>' + spread.toFixed(1) + '</b> (makin kecil makin rata). Babak gugur: juara grup bertemu runner-up grup lain secara silang.</p>';
    } else {
      var sl = c.draw.slots, rows = [];
      for (var i = 0; i < sl.length; i += 2) rows.push('<div class="gcard"><h4><span>Partai ' + (i / 2 + 1) + '</span></h4>' + slotRow(c, ci, i) + slotRow(c, ci, i + 1) + '</div>');
      h += '<p class="small mut">Unggulan teratas ditempatkan berjauhan di bagan dan mendapat BYE lebih dulu bila jumlah peserta tidak pas.</p><div class="gcards">' + rows.join("") + '</div>';
    }
    h += '</div>';
  });
  return h + wNav(true, true);
}
function entRow(c, ci, id, where){
  var e = entById(c, id), key = ci + ":" + where + ":" + id;
  return '<div class="ent ' + (wSel === key ? "sel" : "") + '" data-a="wSwap" data-key="' + esc(key) + '"><span>' + esc(e ? e.name : id) + (e && e.seed ? ' <span class="pill acc">U' + e.seed + '</span>' : '') + '</span><span class="s">' + esc(strTxt(c, e)) + '</span></div>';
}
function slotRow(c, ci, i){
  var s = c.draw.slots[i], key = ci + ":s:" + i;
  if (!s) return '<div class="ent ' + (wSel === key ? "sel" : "") + '" data-a="wSwap" data-key="' + key + '"><span class="mut">BYE</span><span></span></div>';
  var e = entById(c, s.e);
  return '<div class="ent ' + (wSel === key ? "sel" : "") + '" data-a="wSwap" data-key="' + key + '"><span>' + esc(e ? e.name : "?") + (e && e.seed ? ' <span class="pill acc">U' + e.seed + '</span>' : '') + '</span><span class="s">' + esc(strTxt(c, e)) + '</span></div>';
}
function strTxt(c, e){
  if (!e) return "";
  if (c.type === "single") return e.div ? "div " + divTxt(e.div) : "div ?";
  return "kekuatan " + eStrength(c, e);
}
var wSel = null;
ACT.wSwap = function(d){
  if (!wSel){ wSel = d.key; drawWizard(); return; }
  if (wSel === d.key){ wSel = null; drawWizard(); return; }
  var a = wSel.split(":"), b = d.key.split(":"); wSel = null;
  if (a[0] !== b[0]){ toast("Hanya bisa menukar di kategori yang sama"); drawWizard(); return; }
  var c = W.cats[+a[0]];
  function getRef(p){
    if (p[1] === "s") return { arr: c.draw.slots, i: +p[2] };
    if (p[1] === "o") return { arr: c.draw.order, i: c.draw.order.indexOf(p[2]) };
    var g = c.draw.groups[+p[1].slice(1)]; return { arr: g.ids, i: g.ids.indexOf(p[2]) };
  }
  var ra = getRef(a), rb = getRef(b), t = ra.arr[ra.i]; ra.arr[ra.i] = rb.arr[rb.i]; rb.arr[rb.i] = t;
  drawWizard();
};
ACT.wRedraw = function(d){ var c = W.cats[+d.c]; c.draw = makeDraw(c); wSel = null; drawWizard(); };
function wStep6(){
  return '<div class="card"><h2>Ringkasan</h2><p><b>' + esc(W.event.title) + '</b><br><span class="mut">' + esc(W.event.place) + ' · ' + esc(W.event.dates) + '</span></p>' +
    '<div class="tscroll"><table class="lst"><tr><th>Kategori</th><th>Peserta</th><th>Format</th><th>Pertandingan</th><th>Estimasi</th></tr>' +
    W.cats.map(function(c){ var e = estimate(c, c.fmt, W); return '<tr><td>' + esc(c.name) + '</td><td>' + c.entrants.length + '</td><td>' + esc(fmtLabel(c.fmt, c.entrants.length)) + '</td><td>' + e.matches + '</td><td>±' + minTxt(e.mins) + '</td></tr>'; }).join("") + '</table></div>' +
    '<p class="small mut">' + W.settings.tables + ' meja · istirahat minimal ' + W.settings.restMin + ' menit · final best of ' + W.rules.final.bo + ', babak grup best of ' + W.rules.group.bo + '.</p>' +
    (hasT() ? '<div class="warnbox">Turnamen aktif sekarang (' + esc(S.event.title) + ') akan pindah ke Arsip. Datanya tetap tersimpan dan bisa diaktifkan lagi.</div>' : '') +
    '</div><div class="row"><button data-a="wStep" data-s="5">← Kembali</button><button class="pri" data-a="wCreate">Buat turnamen dan jadikan aktif</button></div>';
}
ACT.wCreate = async function(){
  try {
    W.cats.forEach(function(c){ if (!c.draw || c.draw.sig !== drawSig(c)) c.draw = makeDraw(c); });
    var st = buildTournament(W); await API.create(st);
    W = null; adminBuilt = false; wizardBuilt = false; toast("Turnamen dibuat dan aktif"); location.hash = "admin"; render();
  } catch(e){ alert("Gagal membuat turnamen: " + e.message); }
};
